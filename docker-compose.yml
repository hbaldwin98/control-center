# One command: docker compose up --build
# Open https://localhost:8443 (self-signed cert). First-run password is
# in the volume at /data/admin.password:
#   docker compose exec control-center cat /data/admin.password
#
# SearXNG is a private sidecar. It is not published on the host. Control Center
# queries its JSON API; plugins never see the URL.
services:
  reader:
    image: ghcr.io/jina-ai/reader:oss@sha256:8cc9a5cf6dc9c240235fccc0026661de74b6e13c21b36e6a86b3281b9ef10f28
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ${SEARXNG_SETTINGS_FILE:-./deploy/searxng/settings.yml}:/etc/searxng/settings.yml:ro
      - ./deploy/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: control-center-searxng
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      SEARXNG_METHOD: GET
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  control-center:
    build: .
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - cc-data:/data
    environment:
      CC_SEARCH_ENGINE: searxng
      CC_SEARCH_SEARXNG_URL: http://searxng:8080
      CC_SEARCH_SEARXNG_ENGINES: ${CC_SEARCH_SEARXNG_ENGINES:-}
      CC_BROWSER_READER_URL: http://reader:8081
      CC_BROWSER_ENGINE: playwright
      # Caddy runs on the host and is the only route to this listener, which is
      # published on loopback only. See docs/exposure.md.
      CC_TRUSTED_PROXY: "1"
      CC_ORIGINS: https://${CC_DOMAIN},https://localhost:8443
    depends_on:
      - reader
      - searxng

volumes:
  cc-data:
