# Private SearXNG sidecar for Control Center. JSON format is enabled so the host
# can query it; this file is not served on the public internet.
#
# keep_only drops Tor engines (ahmia, torch) that cannot register without Tor,
# and Google/Bing which CAPTCHA datacenter IPs and then suspend for a day.

use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - brave
      - wikipedia
      - wikidata

server:
  limiter: false
  image_proxy: false
  public_instance: false
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "control-center-searxng"
  method: GET

search:
  safe_search: 0
  default_lang: en
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 600
    SearxEngineAccessDenied: 1800
    cf_SearxEngineCaptcha: 1800
    recaptcha_SearxEngineCaptcha: 1800
  formats:
    - html
    - json

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
