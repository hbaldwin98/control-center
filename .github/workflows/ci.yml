name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.work.sum

      # This repo is a Go workspace: `go test ./...` from the root covers the
      # root module ONLY. The module list is read out of go.work rather than
      # written down here, so a plugin module that joins the workspace is tested
      # the day it lands instead of the day someone remembers this file.
      - name: Resolve workspace modules
        id: modules
        run: |
          modules=$(go work edit -json | jq -r '.Use[].DiskPath')
          echo "$modules"
          {
            echo 'list<<EOF'
            echo "$modules"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Checked once over the whole tree. The repo normalizes to LF via
      # .gitattributes, so a Windows checkout cannot see this locally.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build, vet, and test every module
        run: |
          status=0
          while read -r m; do
            [ -n "$m" ] || continue
            echo "::group::$m"
            ( cd "$m" && go build ./... && go vet ./... && go test ./... ) || status=1
            echo "::endgroup::"
          done <<< '${{ steps.modules.outputs.list }}'
          exit $status

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only: the shipped artifact is the thing most likely to break in a
      # way neither test job can see. Nothing is pushed anywhere.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
