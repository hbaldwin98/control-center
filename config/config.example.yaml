# Control Center configuration.
#
# Secrets never live here. API keys, OAuth credentials, and notification channel secrets
# are credential entries, encrypted at rest with a key from the environment or the OS
# keyring. Copy this file to config/config.yaml and edit.
#
# Environment, not this file:
#   CC_MASTER_KEY                  64 hex characters; encrypts every stored secret
#   CC_OAUTH_GOOGLE_CLIENT_ID      enables the Google OAuth provider, with
#   CC_OAUTH_GOOGLE_CLIENT_SECRET
#   CC_OAUTH_CODEX_CLIENT_ID       overrides the public ChatGPT client id. The ChatGPT
#                                  login needs no per-deployment secret and is always
#                                  offered; a credential exists only once an
#                                  administrator completes or imports a login.

server:
  # A loopback address may serve plain HTTP. Any other address requires TLS.
  #
  # Binding loopback port 1455 is worth knowing about: it is the address the ChatGPT
  # login is pinned to, so a control center on the same machine as the browser finishes
  # that sign-in by itself instead of asking for the callback URL to be pasted back. It
  # collides with `codex login` while that is mid-flow, and means nothing to a
  # deployment the browser reaches under any other name.
  addr: "127.0.0.1:8080"

  # PEM paths. Set both or neither.
  tlsCert: ""
  tlsKey: ""

  # Extra acceptable Origin values for mutations, beyond the one implied by addr. Only
  # needed when the server is reached under a name that differs from addr.
  origins: []

  # Set only when a reverse proxy you control is the *only* way to reach the listener.
  # It makes the server read the peer address from X-Forwarded-For, take the original
  # scheme from X-Forwarded-Proto, and stop treating any request as local -- a proxy on
  # this host makes every request look loopback, and privileges hang off that. Left
  # false, forwarded headers are ignored entirely. See docs/exposure.md.
  trustedProxy: false

data:
  dir: "data"
  # Default to <dir>/control-center.db and <dir>/blobs.
  db: ""
  blobDir: ""
  busyTimeout: 5s
  readPool: 8

session:
  # The longest a session may live, however active it is.
  absolute: 12h
  # How long a session survives without a request. Keep it shorter than absolute, or it
  # can never close first and an abandoned session lasts as long as a used one.
  idle: 1h
  # How long a password reauthentication stays valid for credential changes.
  reauthWindow: 5m

blobs:
  # Limits must be finite.
  maxObjectBytes: 67108864   # 64 MiB
  maxScopeBytes: 2147483648  # 2 GiB

ai:
  # Seed providers and routes for an installation that has none yet. After the first
  # start, providers and routes are edited under Models and this file is ignored.
  models: "config/models.yaml"

browser:
  # fake: in-process, no sockets (default, tests, hello).
  # playwright: host-owned Chromium. Plugins never select an engine.
  # Plugins that read real sites (bidrl, tid) need playwright: fake runs no JavaScript.
  engine: fake
  # Optional Jina Reader sidecar. Control Center renders public pages itself and sends
  # only raw HTML here; plugins never see this address and Reader never receives a URL.
  reader:
    url: ""

search:
  # fake: in-process fixtures (default, tests).
  # searxng: host-owned JSON API against a private SearXNG sidecar. Plugins never
  # choose the engine or see this URL. Docker Compose sets CC_SEARCH_ENGINE=searxng.
  engine: fake
  searxng:
    url: "http://127.0.0.1:8888"

harness:
  # Browser users may choose a profile and a directory beneath its workspace root.
  # They cannot supply an executable, flags, environment variables, or an absolute path.
  maxSessions: 4
  maxOutputBytes: 1048576
  stopTimeout: 5s
  profiles: []
  # Example non-interactive Codex profile:
  # profiles:
  #   - id: codex
  #     name: Codex
  #     command: codex
  #     args: ["exec"]
  #     workspaceRoot: "/workspace"
  #     acceptsInstruction: true
